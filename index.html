<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novice to Hero</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
  /* One full-bleed game stage. Single dusk look on any host theme. */
  :root { --night: #14172b; --fg: #f6eedc; color-scheme: dark }
  html, body { height: 100%; margin: 0; background: var(--night); color: var(--fg); overflow: hidden }
  #game { position: fixed; inset: 0; touch-action: none }
  #game canvas { display: block }
</style>
</head>
<body>
<div id="game"></div>
<script type="module" src="/src/main.ts"></script>
</body>
