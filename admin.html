<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Balance Editor</title>
<style>
  /* Live-ops balance editor (src/admin/). Plain, fast, phone-first. */
  :root { --bg: #14172b; --card: #1d2140; --line: #2e3460; --fg: #f1ead8; --muted: #9a9cbc; --acc: #ffcf5a; --chg: #ff9f43; --pat: #5ad1ff; --bad: #ff6b6b; --ok: #6bdc8b; color-scheme: dark }
  * { box-sizing: border-box }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, 'Noto Sans Thai', sans-serif }
  #app { max-width: 1100px; margin: 0 auto; padding: 0 12px 80px }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 8px 0 6px; border-bottom: 1px solid var(--line) }
  h1 { font-size: 22px } h2 { font-size: 17px; margin: 18px 0 8px } h3 { font-size: 13px; margin: 12px 0 6px; color: var(--muted); text-transform: uppercase }
  h3.boss { color: var(--bad) } h3.mini { color: var(--acc) }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 }
  .top { justify-content: space-between }
  .muted { color: var(--muted) } .bad { color: var(--bad) } .warn { color: var(--chg) }
  #status { font-size: 12px }
  button { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; min-height: 36px }
  button:hover { border-color: var(--muted) } button:disabled { opacity: .45; cursor: default }
  button.primary { background: var(--acc); color: #1b1b1b; border-color: var(--acc); font-weight: 700 }
  button.danger { border-color: var(--bad); color: var(--bad) }
  button.small { min-height: 28px; padding: 3px 10px }
  button.icon { min-height: 30px; min-width: 30px; padding: 2px 6px; color: var(--muted) }
  nav { display: flex; gap: 4px; overflow-x: auto; margin-top: 4px }
  nav button, .chips button { white-space: nowrap; border-radius: 999px; padding: 5px 12px; min-height: 32px }
  nav button.on, .chips button.on { background: var(--fg); color: var(--bg) }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0 }
  input, textarea { background: #0f1124; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; width: 100% }
  textarea { margin: 8px 0 }
  .sticky-search { position: sticky; top: 132px; z-index: 4; background: var(--bg); padding: 8px 0 }
  details.mon, details.rel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin: 6px 0; padding: 0 10px }
  details > summary { cursor: pointer; padding: 10px 0; list-style-position: inside }
  details.extra > summary { color: var(--muted); font-size: 12px }
  code { color: var(--muted); font-size: 12px }
  .badge { background: var(--chg); color: #1b1b1b; border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 700 }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 8px }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; padding-bottom: 8px }
  .f { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #181b36 }
  .f label { display: block; font-size: 12.5px; font-weight: 600; overflow-wrap: anywhere; margin-bottom: 4px; cursor: help }
  .f .in { display: flex; gap: 3px } .f .in input { min-width: 0; font-variant-numeric: tabular-nums }
  .f .meta { font-size: 11px; color: var(--muted); margin-top: 3px } .f .meta:empty { display: none }
  .preview { background: #0f1124; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px }
  .preview .chips { margin: 6px 0 } .small { font-size: 11.5px }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; white-space: nowrap }
  .chip small { color: var(--muted) } .chip.chg { border-color: var(--chg); color: var(--chg); font-weight: 700 }
  .sec { border-top: 1px solid var(--line); padding-top: 4px }
  .sec h4 { margin: 6px 0; font-size: 13px; color: var(--acc) }
  details.extra { margin: 2px 0 8px } details.extra > summary { padding: 6px 0 }
  details.idle { border-top: 1px dashed var(--line) } details.idle details.extra { margin-left: 14px }
  .f.pat { border-color: var(--pat) }
  .f.chg { border-color: var(--chg); background: #3a2a1a } .f.chg label { color: var(--chg); font-weight: 700 }
  .scroll { overflow-x: auto } table { border-collapse: collapse; width: 100%; font-size: 13px }
  th, td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top } td.num { text-align: right; font-variant-numeric: tabular-nums } td.new { color: var(--chg); font-weight: 700 }
  .problems { color: var(--chg); font-size: 12px }
  .pill { font-size: 11px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line) } .pill.live { background: var(--ok); color: #111 } .pill.archived { color: var(--muted) }
  dialog { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; width: min(460px, 94vw) }
  dialog::backdrop { background: #000a }
  .gate { max-width: 420px; margin: 18vh auto; text-align: center }
  #toasts { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: grid; gap: 6px; z-index: 20; width: min(520px, 94vw) }
  .toast { background: #0f1124; border: 1px solid var(--ok); border-radius: 8px; padding: 8px 12px } .toast.bad { border-color: var(--bad) }
  @media (max-width: 520px) { .sticky-search { top: 150px } .grid { grid-template-columns: 1fr 1fr } }
</style>
</head>
<body>
<div id="app"><p class="muted" style="text-align:center;margin-top:30vh">กำลังโหลด…</p></div>
<div id="toasts"></div>
<script type="module" src="/src/admin/main.ts"></script>
</body>
</html>
