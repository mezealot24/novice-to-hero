<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Balance Editor · Engine</title>
<style>
  /* Live-ops balance editor (src/admin/). Plain, fast, phone-first, accessible. */
  :root {
    --bg: #14172b;
    --card: #1d2140;
    --line: #2e3460;
    --fg: #f1ead8;
    --muted: #a6a9c8;
    --eff: #c8d7ff;
    --acc: #ffcf5a;
    --chg: #ff9f43;
    --pat: #5ad1ff;
    --bad: #ff6b6b;
    --ok: #6bdc8b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 system-ui, 'Noto Sans Thai', sans-serif;
  }
  #app { max-width: 1180px; margin: 0 auto; padding: 0 12px 84px; }
  header {
    position: sticky;
    top: 0;
    z-index: 6;
    background: var(--bg);
    padding: 8px 0 6px;
    border-bottom: 1px solid var(--line);
  }
  h1, h1.brand { font-size: 19px; margin: 0; line-height: 1.25; }
  h2 { font-size: 17px; margin: 14px 0 8px; }
  h3 { font-size: 14px; margin: 14px 0 6px; color: var(--muted); }
  h3.dg-title { color: var(--fg); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-top: 18px; }
  h4.tier { font-size: 12.5px; margin: 10px 0 4px; color: var(--muted); }
  h4.tier.boss { color: var(--bad); }
  h4.tier.mini { color: var(--acc); }

  /* Focus indicators & accessible target sizes */
  :where(a:any-link, button, input, select, textarea, summary, .table-wrapper):focus-visible {
    outline: 2px solid var(--acc);
    outline-offset: 2px;
  }
  .visually-hidden:where(:not(:focus-within, :active)) {
    position: absolute !important;
    clip-path: inset(50%) !important;
    overflow: hidden !important;
    width: 1px !important;
    height: 1px !important;
    margin: -1px !important;
    padding: 0 !important;
    border: 0 !important;
    white-space: nowrap !important;
  }

  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  .top { justify-content: space-between; }
  .muted { color: var(--muted); }
  .bad { color: var(--bad); }
  .warn { color: var(--chg); }
  #status { font-size: 12px; }

  button {
    background: var(--card);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
    min-block-size: 36px;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--acc); color: #161822; border-color: var(--acc); font-weight: 700; }
  button.danger { border-color: var(--bad); color: var(--bad); }
  button.small { min-block-size: 30px; padding: 4px 10px; font-size: 13px; }
  button.icon { min-block-size: 28px; min-inline-size: 28px; padding: 2px 6px; color: var(--muted); flex-shrink: 0; }
  button.icon.mini { min-block-size: 26px; min-inline-size: 26px; padding: 1px 5px; font-size: 12px; }
  button.mini-link {
    min-block-size: 24px;
    padding: 1px 7px;
    font-size: 11px;
    border-radius: 999px;
    color: var(--pat);
    border-color: #344a78;
    background: #141b36;
  }

  nav { display: flex; gap: 4px; overflow-x: auto; margin-top: 4px; padding-bottom: 2px; }
  nav button, .chips button {
    white-space: nowrap;
    border-radius: 999px;
    padding: 5px 12px;
    min-block-size: 32px;
  }
  nav button.on, .chips button.on { background: var(--fg); color: var(--bg); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; align-items: center; }

  input, textarea, select {
    background: #0f1124;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    font: inherit;
    width: 100%;
    min-block-size: 34px;
  }
  input:invalid:user-invalid { border-color: var(--bad); outline: 1px solid var(--bad); }
  textarea { margin: 8px 0; resize: vertical; }

  /* Mode segmented control (radio pills) */
  .tab-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px 12px;
    margin: 12px 0 8px;
  }
  .tab-head h2 { margin: 0; }
  .mode-seg {
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    margin: 0;
    background: #0f1124;
    display: inline-flex;
    gap: 2px;
  }
  .mode-seg label {
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    color: var(--muted);
    min-block-size: 30px;
    display: inline-flex;
    align-items: center;
    user-select: none;
  }
  .mode-seg input:checked + label {
    background: var(--acc);
    color: #161822;
    font-weight: 700;
  }
  .mode-seg input:focus-visible + label {
    outline: 2px solid var(--acc);
    outline-offset: 2px;
  }

  /* Filter & Bulk bars */
  .filter-bar, .bulk-bar {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin: 8px 0;
  }
  .bulk-bar { border-color: #3a467a; background: #191e3a; }
  .filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
    gap: 8px 10px;
  }
  .fg label, .bc label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
    font-weight: 600;
  }
  .bulk-top { justify-content: flex-start; gap: 8px; margin: 0 0 8px; }
  .bulk-count { font-weight: 700; font-size: 13px; color: var(--fg); }
  .bc-inline { display: flex; align-items: center; gap: 6px; margin-inline-start: auto; flex-wrap: wrap; }
  .bc-inline select { width: auto; min-inline-size: 185px; }
  .bulk-controls {
    display: grid;
    grid-template-columns: minmax(210px, 1.4fr) minmax(140px, 1fr) auto;
    gap: 8px 10px;
    align-items: end;
  }
  .bulk-preview {
    margin-top: 8px;
    padding: 6px 8px;
    border-radius: 6px;
    background: #101327;
    border: 1px dashed var(--line);
    color: var(--eff);
  }

  .sticky-search { position: sticky; top: 112px; z-index: 4; background: var(--bg); padding: 8px 0; }

  /* Cards & expandable Thai field cells */
  details.mon, details.rel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin: 6px 0;
    padding: 0 10px;
    content-visibility: auto;
    contain-intrinsic-size: auto 320px auto 52px;
  }
  details > summary { cursor: pointer; padding: 10px 0; list-style-position: inside; }
  details.extra > summary { color: var(--muted); font-size: 12px; }
  code { color: var(--muted); font-size: 11.5px; }
  .badge { background: var(--chg); color: #161822; border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 700; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 8px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); gap: 8px; padding-bottom: 8px; }
  .f { border: 1px solid var(--line); border-radius: 8px; padding: 8px 9px; background: #181b36; display: flex; flex-direction: column; }
  .f-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; margin-bottom: 3px; }
  .f-head label { display: block; font-size: 12.5px; font-weight: 700; overflow-wrap: anywhere; cursor: pointer; }
  .f-effect { font-size: 12px; color: var(--eff); margin-bottom: 6px; line-height: 1.35; overflow-wrap: anywhere; }
  .f .in { display: flex; gap: 3px; margin-top: auto; }
  .f .in input, .tbl-in input { min-width: 0; font-variant-numeric: tabular-nums; }
  .f .meta, .tbl-hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .f .meta:empty, .tbl-hint:empty { display: none; }
  .f-detail {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed var(--line);
    font-size: 11.5px;
    color: var(--muted);
    display: grid;
    gap: 3px;
  }
  .f-detail[hidden] { display: none; }
  .f-det-text { color: var(--fg); line-height: 1.4; }
  .f.pat { border-color: var(--pat); }
  .f.chg { border-color: var(--chg); background: #3a2a1a; }
  .f.chg .f-head label { color: var(--chg); }

  .preview { background: #0f1124; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .preview .chips { margin: 6px 0; }
  .small { font-size: 12px; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip small { color: var(--muted); }
  .chip.chg { border-color: var(--chg); color: var(--chg); font-weight: 700; }

  details.borrow { border: 1px dashed var(--pat); border-radius: 8px; padding: 0 10px; margin-bottom: 8px; }
  details.borrow > summary { color: var(--pat); font-weight: 600; }
  details.borrow select { background: #0f1124; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px; font: inherit; max-width: 100%; width: auto; }
  details.target { border-color: var(--acc); }
  details.target > summary { color: var(--acc); }

  .grid.stat7 { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
  .grid.stat7 label { display: grid; gap: 2px; }
  .plan { display: grid; gap: 3px; margin: 6px 0; }
  .warn.small { font-size: 11.5px; }
  .sec { border-top: 1px solid var(--line); padding-top: 4px; }
  .sec h4 { margin: 6px 0; font-size: 13px; color: var(--acc); }

  .builder .step { margin: 8px 0 4px; }
  .builder h4 select { margin-left: 8px; font-size: 12px; width: auto; }
  .builder select, .builder input { background: #0f1124; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; width: auto; }
  .builder table { border-collapse: collapse; width: auto; min-width: 100%; font-size: 13px; }
  .builder td, .builder th { border-bottom: 1px solid var(--line); padding: 3px 6px; white-space: nowrap; text-align: left; }
  .builder td input { width: 76px; }
  .builder table.b7 td input { width: 64px; }
  .builder input.chg { border-color: var(--chg); color: var(--chg); font-weight: 700; }
  .builder td.out { font-weight: 700; }
  .builder td.out.chg { color: var(--chg); }

  .sec.kit { border-left: 3px solid var(--pat); padding-left: 8px; }
  .sec.kit h4 { color: var(--pat); }
  .skillcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; align-items: start; }
  .skillcol { content-visibility: auto; contain-intrinsic-size: auto 340px auto 380px; }
  .skillcol .grid { grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); }
  details.extra { margin: 2px 0 8px; }
  details.extra > summary { padding: 6px 0; }
  details.idle { border-top: 1px dashed var(--line); }
  details.idle details.extra { margin-left: 14px; }

  .scroll { overflow-x: auto; }

  /* Responsive Sticky Table Wrapper + Bulk Table */
  .table-wrapper {
    overflow: auto;
    max-inline-size: 100%;
    max-block-size: min(68vh, 660px);
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    container-type: inline-size;
    content-visibility: auto;
    contain-intrinsic-size: auto 900px auto 520px;
  }
  .table-wrapper > table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    font-size: 13px;
  }
  .table-wrapper > table th,
  .table-wrapper > table td {
    border-bottom: 1px solid var(--line);
    padding: 7px 8px;
    text-align: left;
    vertical-align: top;
  }
  .table-wrapper > table thead th {
    position: sticky;
    inset-block-start: 0;
    z-index: 3;
    background: #23284b;
    border-bottom: 2px solid var(--line);
    white-space: nowrap;
  }
  .table-wrapper > table thead th:first-child {
    inset-inline-start: 0;
    z-index: 4;
    border-right: 1px solid var(--line);
  }
  .table-wrapper > table tbody th {
    position: sticky;
    inset-inline-start: 0;
    z-index: 2;
    background: var(--card);
    border-right: 1px solid var(--line);
    min-inline-size: 200px;
  }
  .table-wrapper > table td.num,
  .table-wrapper > table th.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .table-wrapper > table td.new { color: var(--chg); font-weight: 700; }

  .th-row, .row-hdr { display: flex; align-items: flex-start; gap: 8px; }
  .row-name { min-width: 0; }
  .row-name label { cursor: pointer; }
  .th-sub { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
  .bulk-tbl input[type="checkbox"] {
    inline-size: 18px;
    block-size: 18px;
    width: 18px;
    min-block-size: 18px;
    accent-color: var(--acc);
    cursor: pointer;
    flex-shrink: 0;
    margin: 2px 0 0;
    padding: 0;
  }

  .col-pick {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    display: block;
    width: 100%;
    text-align: left;
    padding: 3px 6px;
    border-radius: 6px;
    color: inherit;
    font-weight: 700;
  }
  .col-pick:hover { background: #2c3362; }
  .col-pick.on { background: #31396e; color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
  .col-pick:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }

  .tbl-in { display: flex; gap: 3px; align-items: center; min-inline-size: 120px; }
  .tbl-in input { width: 84px; padding: 4px 6px; min-block-size: 32px; }
  td.tbl-num.pat { background: #182342; }
  td.tbl-num.chg { background: #3a2a1a; }
  td.tbl-num.chg input { border-color: var(--chg); color: var(--chg); font-weight: 700; }
  .tbl-prev { min-inline-size: 130px; font-variant-numeric: tabular-nums; }
  .prev-line { line-height: 1.3; white-space: nowrap; }
  .prev-line.chg { color: var(--chg); font-weight: 700; }
  .tbl-lbl { font-weight: 700; margin-bottom: 2px; }

  .problems { color: var(--chg); font-size: 12px; }
  .pill { font-size: 11px; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); }
  .pill.live { background: var(--ok); color: #111; }
  .pill.archived { color: var(--muted); }
  dialog { background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; width: min(460px, 94vw); }
  dialog::backdrop { background: #000a; }
  .gate { max-width: 420px; margin: 18vh auto; text-align: center; }
  #toasts { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: grid; gap: 6px; z-index: 20; width: min(520px, 94vw); }
  .toast { background: #0f1124; border: 1px solid var(--ok); border-radius: 8px; padding: 8px 12px; }
  .toast.bad { border-color: var(--bad); }

  /* Stacked card transformation for tables inside narrow containers */
  @container (width < 600px) {
    .table-wrapper {
      max-block-size: 74dvh;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 8px;
      background: #14172b;
    }
    .table-wrapper > table,
    .table-wrapper > table thead,
    .table-wrapper > table tbody,
    .table-wrapper > table tr,
    .table-wrapper > table th,
    .table-wrapper > table td {
      display: block;
      inline-size: 100%;
    }
    .table-wrapper > table thead {
      display: none;
    }
    .table-wrapper > table tbody tr {
      margin-block-end: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      overflow: hidden;
    }
    .table-wrapper > table tbody th {
      position: sticky;
      inset-block-start: 0;
      inset-inline-start: auto;
      z-index: 2;
      background: #23284b;
      border-right: 0;
      border-bottom: 1px solid var(--line);
      padding: 10px;
      min-inline-size: 0;
    }
    .table-wrapper > table tbody td {
      display: grid;
      grid-template-columns: minmax(105px, 37%) minmax(0, 1fr);
      gap: 2px 10px;
      align-items: center;
      padding: 8px 10px;
      text-align: start;
    }
    .table-wrapper > table tbody td.num { text-align: start; }
    .table-wrapper > table tbody td > * { grid-column: 2; }
    .table-wrapper > table tbody td::before {
      grid-column: 1;
      grid-row: 1;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      align-self: start;
      padding-top: 3px;
    }
    .table-wrapper > table tbody td:nth-child(2)::before { content: var(--label-2) ": "; }
    .table-wrapper > table tbody td:nth-child(3)::before { content: var(--label-3) ": "; }
    .table-wrapper > table tbody td:nth-child(4)::before { content: var(--label-4) ": "; }
    .table-wrapper > table tbody td:nth-child(5)::before { content: var(--label-5) ": "; }
    .table-wrapper > table tbody td:nth-child(6)::before { content: var(--label-6) ": "; }
    .table-wrapper > table tbody td:nth-child(7)::before { content: var(--label-7) ": "; }
    .table-wrapper > table tbody td:nth-child(8)::before { content: var(--label-8) ": "; }
    .table-wrapper > table tbody td:nth-child(9)::before { content: var(--label-9) ": "; }
    .tbl-in input { width: 100%; }
  }

  /* Fallback containment for browsers without content-visibility: auto */
  @supports not (content-visibility: auto) {
    details.mon, details.rel, .skillcol, .table-wrapper {
      contain: layout style paint;
    }
  }

  @media (max-width: 640px) {
    .sticky-search { top: 124px; }
    .grid { grid-template-columns: 1fr; }
    .skillcols, .skillcol .grid { grid-template-columns: 1fr; }
    .filter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .filter-grid .fg:first-child { grid-column: 1 / -1; }
    .bulk-controls { grid-template-columns: 1fr; }
    .bc-inline { margin-inline-start: 0; width: 100%; }
    .bc-inline select { width: 100%; }
    input, select, textarea { font-size: 16px; }
  }

  @media (pointer: coarse) {
    button { min-block-size: 44px; }
    button.icon, button.info-btn { min-block-size: 38px; min-inline-size: 38px; }
    input, select { min-block-size: 44px; }
    .bulk-tbl input[type="checkbox"] { inline-size: 24px; block-size: 24px; width: 24px; min-block-size: 24px; }
  }
</style>
</head>
<body>
<div id="app"><p class="muted" style="text-align:center;margin-top:30vh">กำลังโหลด…</p></div>
<div id="announce" class="visually-hidden" aria-live="polite"></div>
<div id="toasts"></div>
<script type="module" src="/src/admin/main.ts"></script>
</body>
</html>
